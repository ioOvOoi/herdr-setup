name: tests

# The tests run the mods' own functions with stubs, so no Herdr is needed.
# `herdr-app check` is the other half and needs a running app; run it locally.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: mod tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do
            printf '%-28s ' "$test"
            node "$test" >/tmp/test.out && tail -1 /tmp/test.out
          done
      - name: install into a scratch Herdr home
        run: |
          mkdir -p /tmp/herdr-home
          HERDR_APP_HOME=/tmp/herdr-home ./install.sh
          test -f /tmp/herdr-home/layouts/workspace.json
          test -d /tmp/herdr-home/mods/agents-list
          test -d /tmp/herdr-home/mods/hoverfocus
          test ! -e /tmp/herdr-home/mods/search
          python3 - <<'PY'
          import json
          keys = json.load(open("/tmp/herdr-home/keys.json"))
          layout = keys.get("layout:workspace", {})
          assert layout.get("alt-f") == "mod.open:agents-list", layout
          assert keys["global"].get("ctrl-q") == "overlay.close", keys["global"]
          assert keys["terminal"].get("ctrl-q") == "send:\u0011", keys["terminal"]
          print("keys merged:", len(layout), "layout bindings")
          PY
